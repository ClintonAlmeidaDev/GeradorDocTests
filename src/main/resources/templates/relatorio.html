<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Relatório de Auditoria de Testes API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      color: #2d3748;
      background-color: #ffffff;
    }
    h1 {
      color: #1a365d;
      border-bottom: 2px solid #2b6cb0;
      padding-bottom: 10px;
      font-size: 24px;
    }
    h2 {
      color: #2b6cb0;
      margin-top: 30px;
      font-size: 18px;
    }
    .summary-box {
      background-color: #edf2f7;
      border: 1px solid #cbd5e0;
      padding: 15px 20px;
      border-radius: 6px;
      margin-bottom: 25px;
    }
    .summary-box p {
      margin: 6px 0;
      font-size: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #cbd5e0;
      padding: 10px 12px;
      text-align: left;
    }
    th {
      background-color: #2b6cb0;
      color: #ffffff;
      font-weight: bold;
    }
    tr:nth-child(even) {
      background-color: #f7fafc;
    }
    .status-pass {
      color: #2f855a;
      font-weight: bold;
    }
    .status-fail {
      color: #c53030;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>Relatório de Auditoria de Testes - Bruno CLI</h1>

<div class="summary-box">
  <h3>Resumo da Execução</h3>
  <p><strong>Total de Requisições:</strong> <span th:text="${summary.path('totalRequests').asText('0')}">5</span></p>
  <p><strong>Passaram:</strong> <span th:text="${summary.path('passed').asText('0')}">5</span></p>
  <p><strong>Falharam:</strong> <span th:text="${summary.path('failed').asText('0')}">0</span></p>
</div>

<h2>Detalhamento das Requisições</h2>

<table>
  <thead>
  <tr>
    <th>Nome da Requisição</th>
    <th>Método</th>
    <th>URL</th>
    <th>Status Code</th>
    <th>Tempo (ms)</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="item : ${results}">
    <td th:text="${item.path('name').asText('-')}">Nome</td>
    <td th:text="${item.path('request').path('method').asText('-')}">GET</td>
    <td th:text="${item.path('request').path('url').asText('-')}">http://...</td>
    <td th:text="${item.path('response').path('status').asText('-')}"
        th:class="${item.path('response').path('status').asInt(0) < 400 ? 'status-pass' : 'status-fail'}">200</td>
    <td th:text="${item.path('response').path('responseTime').asText('0')}">0</td>
  </tr>
  </tbody>
</table>

</body>
</html>
