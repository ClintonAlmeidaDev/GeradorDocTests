# Copy to .gitlab-ci.yml. Image provides Maven/Java; install Node 22 without a remote shell script.
image: maven:3.9.9-eclipse-temurin-21
stages: [audit]
api-audit:
  stage: audit
  before_script:
    - apt-get update && apt-get install -y curl xz-utils
    - curl --fail --show-error --location https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz -o /tmp/node.tar.xz
    - tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
    - npm install -g @usebruno/cli@4.0.0 newman@6.2.2
    - bru --version && newman --version
    - mvn -B -ntp clean package
    - java -cp target/gerador-docs-tests-3.0.0.jar com.microsoft.playwright.CLI install --with-deps chromium
  script:
    - bash scripts/run_ci.sh --collection examples/pass.postman_collection.json --environment HML
  artifacts:
    when: always
    paths:
      - audit-artifacts/
    expire_in: 30 days
