# Copy to .github/workflows/api-audit.yml
name: API evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare
        run: |
          npm install -g @usebruno/cli@4.0.0 newman@6.2.2
          bru --version
          newman --version
          mvn -B -ntp clean package
          java -cp target/gerador-docs-tests-3.0.0.jar com.microsoft.playwright.CLI install --with-deps chromium
      - name: Audit
        run: bash scripts/run_ci.sh --collection examples/pass.postman_collection.json --environment HML
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-evidence
          path: audit-artifacts/
          if-no-files-found: warn
